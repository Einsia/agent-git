[profile.windows]
test-threads = 4
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

# #386: the slow Windows privacy runs print their step timing and lock waits even when they pass.
[[profile.windows.overrides]]
filter = "binary(privacy_lifecycle)"
success-output = "immediate"
failure-output = "immediate"

[profile.windows.junit]
path = "junit.xml"
