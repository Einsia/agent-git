[package]
name = "agit-tunnel"
version = "0.1.0"
edition = "2024"

[features]
default = []
worker = ["dep:tokio-tungstenite", "dep:http", "dep:hyper-util", "dep:httparse", "dep:tower-service"]
test-support = ["worker"]

[[bin]]
name = "agit-tunnel"
path = "src/main.rs"
required-features = ["worker"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std", "io-util", "sync", "process", "time", "net"] }
futures-util = { version = "0.3", features = ["sink"] }
url = "2"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
http = { version = "1", optional = true }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy", "tokio"], optional = true }
httparse = { version = "1", optional = true }
tower-service = { version = "0.3", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
