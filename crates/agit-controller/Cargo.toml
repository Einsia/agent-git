[package]
name = "agit-controller"
version = "0.1.0"
edition = "2024"

[features]
default = []
cloud = ["dep:agit-peer"]
host = ["cloud", "agit-tunnel/worker", "tokio/io-std", "tokio/rt-multi-thread"]

[[bin]]
name = "agitd-controller"
path = "src/bin/agitd-controller.rs"
required-features = ["host"]

[dependencies]
agit-peer = { path = "../agit-peer", features = ["cloud-client"], optional = true }
agit-tunnel = { path = "../agit-tunnel" }
anyhow = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
futures-util = { version = "0.3", features = ["sink"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
agit-tunnel = { path = "../agit-tunnel", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "0.26"

[[example]]
name = "cloud_probe"
required-features = ["host"]
