# agit's own rules — the same schema as the vendored `gitleaks.toml`, loaded by the same engine.
#
# Holds only the shapes gitleaks cannot have, or that gitleaks misses and that have actually
# bitten us. Anything gitleaks already covers (AWS / GitHub / npm / Slack / OpenAI / Anthropic /
# HuggingFace / JWT ...) is never repeated here: two rule sets drift, and the drifting one rots
# first.

title = "agit rules"

description = "base64 media and archive payloads"
regexes = [
    '''^(?:/9j/|iVBORw0KGgo|R0lGOD[dl]h|UklGR|JVBERi0|H4sI|UEsDB)[A-Za-z0-9+/]{16,}={0,2}$''',
]

[[rules]]
id = "agit-token"
description = "AgentGit access, refresh, or artifact download credential"
regex = '''\bagit_(?:at|rt|lfs)_[0-9a-f]{64}\b'''
keywords = [
    "agit_at_",
    "agit_rt_",
    "agit_lfs_",
]

# A private-key header opens a sensitive region. The shared scanner extends this
# match through the matching footer or the end of an incomplete carrier.
[[rules]]
id = "agit-private-key-header"
description = "PEM private key region (including truncated private key output)"
regex = '''-----BEGIN[ A-Za-z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

# gitleaks has no general "password in a URL" rule (only the sidekiq kind, bound to one
# specific host). And `git clone https://user:pass@host/...` is one of the most common
# credential shapes in a transcript.
#
# The capture group frames the password itself: both the report and the mask cover only the
# password, and the host name and the user name stay readable.
[[rules]]
id = "agit-credentials-in-url"
description = "password embedded in a URL"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.\-]*://[^/\s:@]+:([^/\s@]{3,})@[^\s/]+'''
keywords = ["://"]
[[rules.allowlists]]
# A placeholder in documentation is not a credential. Allow only the "obviously a placeholder"
# shapes, never anything that looks like a real password — the cost of a false positive on this
# rule is one more allowlist line; the cost of a miss is a credential in history.
regexes = [
    '''^(?i:pass(?:word|wd)?|pwd|secret|token|changeme|xxx+|\*+|\.\.\.)$''',
    '''^\$\{?[A-Za-z_][A-Za-z0-9_]*}?$''',
    '''^%[A-Za-z_][A-Za-z0-9_]*%$''',
    '''^[<{]{1,2}[^>}]{1,40}[>}]{1,2}$''',
]
