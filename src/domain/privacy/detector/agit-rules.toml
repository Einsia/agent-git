# agit's own rules — the same schema as the vendored `gitleaks.toml`, loaded by the same engine.
#
# Holds only the shapes gitleaks cannot have, or that gitleaks misses and that have actually
# bitten us. Anything gitleaks already covers (AWS / GitHub / npm / Slack / OpenAI / Anthropic /
# HuggingFace / JWT ...) is never repeated here: two rule sets drift, and the drifting one rots
# first.

title = "agit rules"

description = "base64 media and archive payloads"
regexes = [
    '''^(?:/9j/|iVBORw0KGgo|R0lGOD[dl]h|UklGR|JVBERi0|H4sI|UEsDB)[A-Za-z0-9+/]{16,}={0,2}$''',
]

# Every credential the Hub issues: a prefix naming its kind, then 32 random bytes in hex. Agents
# run agit and paste its output, configuration files included, into the transcripts agit
# publishes.
[[rules]]
id = "agit-token"
description = "AgentGit access, refresh, personal access, device, controller or artifact download credential"
regex = '''\bagit_(?:at|rt|lfs|pat|rc|wc|wct|pc)_[0-9a-f]{64}\b'''
keywords = ["agit_"]

# A sign-up or web sign-in code: short-lived, but it signs in whoever holds it first.
[[rules]]
id = "agit-login-code"
description = "AgentGit sign-up or web sign-in code"
regex = '''\b(agit_(?:su|wh)_[A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
keywords = ["agit_su_", "agit_wh_"]

# A bearer credential wherever it is written: a configuration file's headers, a log line, a
# pasted request. gitleaks recognises one only inside `curl -H`. The capture group frames the
# credential, so the scheme name stays readable.
[[rules]]
id = "agit-bearer-token"
description = "bearer credential in an authorization value"
regex = '''(?i)\bbearer[ \t]+([A-Za-z0-9._~+/-]{24,}=*)'''
entropy = 3.0
keywords = ["bearer"]
[[rules.allowlists]]
# Words and placeholders written in their place, never a value with digits or symbols mixed in.
regexes = [
    '''^[A-Za-z]+$''',
    '''^[A-Za-z]+(?:[._-][A-Za-z]+)+$''',
]

# A PostHog personal API key reads and writes a project's data. gitleaks has no PostHog rule;
# the project key (`phc_`) is public by design and stays out.
[[rules]]
id = "posthog-personal-api-key"
description = "PostHog personal API key"
regex = '''\bphx_[A-Za-z0-9]{32,64}\b'''
keywords = ["phx_"]

# A JSON Web Token written straight after a vendor's prefix (`hsk_eyJ…`). gitleaks' JWT rule needs
# a word boundary before `eyJ`, and the prefix's underscore leaves none, so neither it nor a
# credential assignment, which reads a dotted value as code, sees the token.
[[rules]]
id = "agit-prefixed-jwt"
description = "JSON Web Token behind a vendor prefix"
regex = '''\b[A-Za-z][A-Za-z0-9]{1,15}_ey[A-Za-z0-9_-]{17,}\.ey[A-Za-z0-9_-]{17,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["_ey"]

# A model provider key in the `sk-` format: OpenAI's legacy keys and the OpenAI-compatible
# providers that copied them. gitleaks names only OpenAI's own prefixed shapes, so such a key
# written anywhere but after a credential name is published. Lowercase words joined by hyphens
# are a name, not a key; a run of mixed-case letters with no separator is random, so it is a key.
[[rules]]
id = "agit-sk-api-key"
description = "model provider API key in the sk- format"
regex = '''\bsk-[A-Za-z0-9_-]{32,}'''
entropy = 3.5
keywords = ["sk-"]
[[rules.allowlists]]
regexes = [
    '''^sk-[a-z]+(?:-[a-z]+)+$''',
]

# `hrk_` and `hsk_` tokens: a fixed prefix and a long token, the shape gitleaks gives its vendor
# rules. Agents print them from a task runner's configuration and its tool output.
[[rules]]
id = "agit-hrk-hsk-token"
description = "hrk_ or hsk_ access token"
regex = '''\bh[rs]k_[A-Za-z0-9_-]{20,}'''
keywords = ["hrk_", "hsk_"]

# A Slack token whose numeric groups are longer than gitleaks' rules allow. gitleaks caps them at
# thirteen digits, so a token with longer team or user ids never starts to match there.
[[rules]]
id = "agit-slack-token"
description = "Slack token with long numeric groups"
regex = '''\bxox[abposr]-[0-9]{8,}-[0-9]{8,}-[A-Za-z0-9]{16,}'''
keywords = ["xoxa-", "xoxb-", "xoxo-", "xoxp-", "xoxr-", "xoxs-"]

# curl asks for a password when `-u` names a user and no password, and echoes that user in the
# prompt. A command that passes a credential to `-u` without a colon therefore prints the
# credential itself, inside the quotes. curl does not escape a quote in the value, so the value
# ends at the quote and colon that close the prompt, not at its first quote.
[[rules]]
id = "agit-curl-echoed-user"
description = "credential echoed by curl's password prompt"
regex = '''Enter (?:host|proxy) password for user '([^\r\n]{6,200}?)':'''
keywords = ["password for user"]

# git asks for a password for a URL whose user part a command filled with a credential
# (`https://<token>@host/…`) and prints that URL in the prompt. The user part is the credential;
# only it is replaced, so the host stays readable. A `user:password` URL is
# `agit-credentials-in-url`'s.
[[rules]]
id = "agit-git-prompt-url-user"
description = "credential in the URL user git's password prompt prints"
regex = '''Password for '[A-Za-z][A-Za-z0-9+.-]*://([^'@:/\s]{6,200})@[^'\s]*'''
keywords = ["password for '"]

# A private-key header, in any letter case, opens a sensitive region. The shared scanner
# extends this match through the matching footer or the end of an incomplete carrier.
[[rules]]
id = "agit-private-key-header"
description = "PEM private key region (including truncated private key output)"
regex = '''(?i)-----BEGIN[ A-Z0-9_-]{0,100}PRIVATE KEY(?: BLOCK)?-----'''
keywords = ["-----begin"]

# gitleaks has no general "password in a URL" rule (only the sidekiq kind, bound to one
# specific host). And `git clone https://user:pass@host/...` is one of the most common
# credential shapes in a transcript.
#
# The capture group frames the password itself: both the report and the mask cover only the
# password, and the host name and the user name stay readable.
[[rules]]
id = "agit-credentials-in-url"
description = "password embedded in a URL"
regex = '''\b[a-zA-Z][a-zA-Z0-9+.\-]*://[^/\s:@]+:([^/\s@]{3,})@[^\s/]+'''
keywords = ["://"]
[[rules.allowlists]]
# A placeholder in documentation is not a credential. Allow only the "obviously a placeholder"
# shapes, never anything that looks like a real password — the cost of a false positive on this
# rule is one more allowlist line; the cost of a miss is a credential in history.
regexes = [
    '''^(?i:pass(?:word|wd)?|pwd|secret|token|changeme|xxx+|\*+|\.\.\.)$''',
    '''^\$\{?[A-Za-z_][A-Za-z0-9_]*}?$''',
    '''^%[A-Za-z_][A-Za-z0-9_]*%$''',
    '''^[<{]{1,2}[^>}]{1,40}[>}]{1,2}$''',
]
